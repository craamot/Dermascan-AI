<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<title>Profil Pengguna</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(
        135deg,
        #ffffff 0%,
        #dff7ff 40%,
        #b8ecff 100%
    );
    min-height:100vh;
}

/* ================= NAVBAR ================= */

.navbar{
    width:100%;
    padding:18px 60px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 8px 18px rgba(0,0,0,.15);
}

.logo-title{
    display:flex;
    align-items:center;
    gap:15px;
    font-size:24px;
}

.logo{
    width:55px;
    height:55px;
    background:#19c5f3;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo img{
    width:35px;
}

.nav-links{
    display:flex;
    gap:60px;
}

.nav-links a{
    text-decoration:none;
    color:black;
    font-size:20px;
    display:flex;
    align-items:center;
    gap:8px;
}

.nav-links a i{
    color:#19c5f3;
}

/* ================= PROFILE ================= */

.profile-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:50px;
}

.profile-card{
    width:550px;
    background:white;
    border-radius:25px;
    padding:40px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.avatar{
    width:130px;
    height:130px;
    margin:auto;
    background:#19c5f3;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:55px;
}

.username{
    margin-top:20px;
    font-size:32px;
    font-weight:bold;
}

.role{
    color:#777;
    margin-top:8px;
}

.info-box{
    margin-top:35px;
}

.info-item{
    background:#f7fbfd;
    padding:18px;
    border-radius:12px;
    margin-bottom:15px;
    text-align:left;
}

.label{
    color:#777;
    font-size:14px;
}

.value{
    font-size:18px;
    font-weight:bold;
    margin-top:5px;
}

.profile-actions{
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:15px;
}

.btn{
    padding:12px 24px;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
}

.btn-blue{
    background:#19c5f3;
    color:white;
}

.btn-red{
    background:#ff4d4d;
    color:white;
}

/* ================= MOBILE RESPONSIVE ================= */

@media screen and (max-width:768px){

    .navbar{
        padding:15px;
        flex-direction:column;
        gap:15px;
    }

    .logo-title{
        font-size:18px;
    }

    .logo{
        width:45px;
        height:45px;
    }

    .nav-links{
        width:100%;
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .nav-links a{
        justify-content:center;
        font-size:15px;
        padding:10px;
        background:white;
        border-radius:10px;
        box-shadow:0 3px 8px rgba(0,0,0,.08);
    }

    .profile-wrapper{
        padding:15px;
        margin-top:20px;
    }

    .profile-card{
        width:100%;
        padding:25px 20px;
        border-radius:20px;
    }

    .avatar{
        width:100px;
        height:100px;
        font-size:40px;
    }

    .username{
        font-size:24px;
    }

    .role{
        font-size:14px;
    }

    .info-item{
        padding:15px;
    }

    .value{
        font-size:16px;
        word-break:break-word;
    }

    .profile-actions{
        flex-direction:column;
        gap:10px;
    }

    .btn{
        width:100%;
        text-align:center;
    }
}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="logo-title">
        <div class="logo">
            <img src="{{ url_for('static', filename='foto/finger.png') }}" alt="Logo">
        </div>
        Dermascan
    </div>

    <div class="nav-links">
        <a href="/">
            <i class="fa-solid fa-house"></i>
            Home
        </a>

        <a href="/scan">
            <i class="fa-solid fa-camera"></i>
            Scan
        </a>

        <a href="/riwayat">
            <i class="fa-solid fa-clock-rotate-left"></i>
            Riwayat
        </a>

        <a href="/profil">
            <i class="fa-solid fa-user"></i>
            Profil
        </a>
    </div>

</div>

<!-- PROFILE -->

<div class="profile-wrapper">

    <div class="profile-card">

        <div class="avatar">
            <i class="fa-solid fa-user"></i>
        </div>

        <div class="username">
            {{ session['username']|upper }}
        </div>

        <div class="role">
            Pengguna SkinScan AI
        </div>

        <div class="info-box">

            <div class="info-item">
                <div class="label">Username</div>
                <div class="value">
                    {{ session['username'] }}
                </div>
            </div>

            <div class="info-item">
                <div class="label">Status Akun</div>
                <div class="value">
                    Aktif
                </div>
            </div>

            <div class="info-item">
                <div class="label">Total Analisis</div>
                <div class="value">
                    {{ total if total else 0 }}
                </div>
            </div>

        </div>

        <div class="profile-actions">

            <a href="/riwayat" class="btn btn-blue">
                <i class="fa-solid fa-clock-rotate-left"></i>
                Lihat Riwayat
            </a>

            <a href="/logout" class="btn btn-red">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>

        </div>

    </div>

</div>

</body>
</html>
