<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skinscan AI Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(
        135deg,
        #ffffff 0%,
        #eaf9ff 35%,
        #bfefff 70%,
        #8fdcf5 100%
    );
}

.container{
    width:90%;
    max-width:1200px;
    height:650px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.logo-title{
    position:absolute;
    top:-10px;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:34px;
    font-weight:500;
    color:#222;
}

.logo{
    width:55px;
    height:55px;
    background:#1ec9f3;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo img{
    width:35px;
}

.login-box{
    width:450px;
    background:white;
    border-radius:20px;
    padding:40px 35px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.profile{
    text-align:center;
    margin-bottom:30px;
}

.profile-icon{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:50%;
    background:#efefef;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#70d9f7;
    font-size:28px;
}

.profile h3{
    margin-top:15px;
    font-size:18px;
    color:#444;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#f3f3f3;
    outline:none;
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
    margin:15px 0 25px;
}

.login-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#a8e3f7;
    color:#222;
    font-size:28px;
    font-weight:600;
    cursor:pointer;
}

.login-btn:hover{
    background:#8dd8f1;
}

.register-link{
    text-align:center;
    margin-top:20px;
}

.register-link a{
    color:#1ec9f3;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo-title">
    <div class="logo">
        <img src="{{ url_for('static', filename='foto/finger.png') }}" alt="Logo">
    </div>
    Dermascan
</div>

    <div class="login-box">

        <form action="/login" method="POST">

            <div class="profile">
                <div class="profile-icon">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3>LOGIN DOKTER</h3>
            </div>

            <div class="input-group">
                <label>
                    <i class="fa-solid fa-user"></i> Username
                </label>
                <input type="text" name="username" placeholder="Masukkan username" required>
            </div>

            <div class="input-group">
                <label>
                    <i class="fa-solid fa-lock"></i> Password
                </label>
                <input type="password" name="password" placeholder="Masukkan password" required>
            </div>

            <div class="remember">
                <input type="checkbox">
                <span>Ingat saya</span>
            </div>

            <button type="submit" class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk
            </button>

            <div class="register-link">
                Belum punya akun?
                <a href="/register">Daftar akun baru</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
